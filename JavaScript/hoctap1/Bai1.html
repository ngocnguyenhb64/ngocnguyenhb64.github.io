<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Thông Tin Liên Hệ</title>
    <style>
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #FFFEBD;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
        }

        .contact-card {
            background-color: #ffffff;
            border-top: 8px solid #EBD586; 
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 450px;
            text-align: center;
        }

        .contact-card h3 {
            color: #4F8557; 
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .contact-card hr {
            border: 0;
            height: 1px;
            background-color: #FFEF37; /* Đường gạch ngang màu*/
            margin-bottom: 20px;
        }

        .contact-info {
            color: #7AB276;
            font-size: 15px;
            line-height: 1.8;
        }

        .contact-info .name {
            font-size: 18px;
            font-weight: bold;
            color: #4F8557;
            margin-bottom: 5px;
        }
    body,td,th {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}
    </style>
</head>
<body>

<div class="contact-card">
  <script>
        document.writeln("<h3>Mọi chi tiết xin vui lòng liên hệ</h3>");
        document.writeln("<hr />");
        document.writeln("<div class='contact-info'>");
        document.writeln("  <div class='name'>Nguyễn Hồng Bảo Ngọc</div>");
        document.writeln("  <div>Trường Cao đẳng Kỹ thuật - Công nghệ Đồng Nai</div>");
        document.writeln("  <div><b>Điện thoại:</b> 0767******</div>");
        document.writeln("  <div><b>Email:</b> ngochongbn@gmail.com</div>");
        document.writeln("</div>");
    </script>
</div>

</body>
</html>
